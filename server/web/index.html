<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies To Watch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="container mx-auto p-6 max-w-7xl">
        <header class="flex flex-col md:flex-row md:justify-between md:items-center pb-6 mb-6 border-b border-gray-800 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-400">Movies To Watch</h1>
            </div>
            
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                
                <div class="relative w-full sm:w-64">
                    <button onclick="toggleGenreDropdown(event)" id="dropdown-btn" 
                            class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 w-full flex justify-between items-center transition">
                        <span id="dropdown-label" class="truncate text-gray-400">Filter by genres...</span>
                        <svg class="h-3 w-3 text-gray-400 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    
                    <div id="dropdown-menu" class="hidden absolute left-0 right-0 mt-1 bg-gray-950 border border-gray-800 rounded-lg shadow-2xl z-50 max-h-60 overflow-y-auto p-2 space-y-1">
                        </div>
                </div>

                <div class="flex space-x-1.5 bg-gray-950 p-1 rounded-lg border border-gray-800">
                    <button onclick="setStatusFilter('')" id="btn-filter-all" class="bg-gray-800 text-gray-200 px-3 py-1.5 rounded-md text-xs font-medium transition">All</button>
                    <button onclick="setStatusFilter('pending')" id="btn-filter-pending" class="text-amber-400 hover:bg-amber-600/10 px-3 py-1.5 rounded-md text-xs font-medium transition">Pending</button>
                    <button onclick="setStatusFilter('watched')" id="btn-filter-watched" class="text-emerald-400 hover:bg-emerald-600/10 px-3 py-1.5 rounded-md text-xs font-medium transition">Watched</button>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <section class="lg:col-span-7 bg-gray-800/50 border border-gray-800 rounded-xl p-6 shadow-xl backdrop-blur-sm">
                <h2 class="text-xl font-semibold mb-4 text-gray-200 flex items-center">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full mr-2"></span> My Watchlist
                </h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4 w-12">ID</th>
                                <th class="py-3 px-4">Title</th>
                                <th class="py-3 px-4 w-20 text-center">Year</th>
                                <th class="py-3 px-4">Genres</th>
                                <th class="py-3 px-4 text-center w-24">Status</th>
                                <th class="py-3 px-4 text-center w-16">Action</th>
                            </tr>
                        </thead>
                        <tbody id="watchlist-body" class="divide-y divide-gray-800/50 text-sm">
                            </tbody>
                    </table>
                </div>
            </section>

            <section class="lg:col-span-5 bg-gray-800/50 border border-gray-800 rounded-xl p-6 shadow-xl backdrop-blur-sm h-fit">
                <h2 class="text-xl font-semibold mb-4 text-gray-200 flex items-center">
                    <span class="w-2 h-2 bg-pink-500 rounded-full mr-2"></span> Discover Movies (TMDB)
                </h2>
                
                <div class="flex space-x-2 mb-6">
                    <input type="text" id="search-input" placeholder="Search title (e.g., Inception)..." 
                           class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-indigo-500 placeholder-gray-500 transition">
                    <button onclick="searchTMDB()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20">
                        Search
                    </button>
                </div>

                <div id="search-results" class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    <p class="text-sm text-gray-500 text-center py-8">Search for a film title to populate records.</p>
                </div>
            </section>

        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:5000";
        
        // Track visual filtering states globally
        let currentStatusFilter = '';
        let activeSelectedGenres = new Set();
        let globalUniqueGenresList = [];

        // Helper framework wrapper handling standard fetch logic
        async function apiRequest(endpoint, method = "GET", data = null) {
            const config = {
                method: method,
                headers: { "Content-Type": "application/json" }
            };
            if (data) config.body = JSON.stringify(data);

            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, config);
                
                if (!response.ok) {
                    let errorMsg = `Error ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.message) errorMsg = errData.message;
                    } catch(e) {}
                    alert(`[-] API Alert: ${errorMsg}`);
                    return null;
                }

                const text = await response.text();
                return text ? JSON.parse(text) : true;
            } catch (err) {
                alert(`[-] Network error. Ensure server is live at ${BASE_URL}`);
                return null;
            }
        }

        // Extracts all unique genres across every stored row to populate dropdown options
        async function updateDynamicGenreOptions() {
            // Always request the un-filtered complete list to inventory all available genres
            const completeList = await apiRequest('/movies');
            if (!completeList || completeList === "ERROR") return;

            const trackedGenres = new Set();
            completeList.forEach(movie => {
                let genres = movie.genre || [];
                if (typeof genres === 'string') {
                    try { genres = JSON.parse(genres); } catch(e) { genres = [genres]; }
                }
                if (Array.isArray(genres)) {
                    genres.forEach(g => { if (g) trackedGenres.add(g.trim()); });
                }
            });

            globalUniqueGenresList = Array.from(trackedGenres).sort();
            renderGenreDropdownMenu();
        }

        // Renders the multi-select options inside the floating box panel
        function renderGenreDropdownMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.innerHTML = '';

            if (globalUniqueGenresList.length === 0) {
                menu.innerHTML = '<p class="text-[10px] text-gray-500 text-center py-2">No genres found.</p>';
                return;
            }

            globalUniqueGenresList.forEach(genre => {
                const isChecked = activeSelectedGenres.has(genre);
                const item = document.createElement('div');
                item.className = `flex items-center px-2 py-1.5 rounded cursor-pointer transition select-none text-xs text-gray-300 hover:bg-gray-800 ${isChecked ? 'bg-indigo-600/20 text-indigo-400' : ''}`;
                item.onclick = (e) => {
                    e.stopPropagation(); // Stop click from bubbling up and automatically closing menu
                    toggleGenreSelection(genre);
                };

                item.innerHTML = `
                    <input type="checkbox" ${isChecked ? 'checked' : ''} 
                           class="rounded bg-gray-900 border-gray-700 text-indigo-600 focus:ring-0 focus:ring-offset-0 mr-2 w-3.5 h-3.5 pointer-events-none">
                    <span class="truncate">${genre}</span>
                `;
                menu.appendChild(item);
            });

            updateDropdownLabel();
        }

        // Toggles local UI state flags when an item choice changes state
        function toggleGenreSelection(genre) {
            if (activeSelectedGenres.has(genre)) {
                activeSelectedGenres.delete(genre);
            } else {
                activeSelectedGenres.add(genre);
            }
            renderGenreDropdownMenu();
            applyActiveFilters();
        }

        // Dynamic textual update of dropdown field placeholders
        function updateDropdownLabel() {
            const label = document.getElementById('dropdown-label');
            if (activeSelectedGenres.size === 0) {
                label.innerText = "Filter by genres...";
                label.className = "truncate text-gray-400";
            } else {
                label.innerText = Array.from(activeSelectedGenres).join(', ');
                label.className = "truncate text-indigo-400 font-medium";
            }
        }

        function toggleGenreDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }

        // Close dropdown container instantly if user clicks outside context zone elements
        document.addEventListener('click', () => {
            document.getElementById('dropdown-menu').classList.add('hidden');
        });

        // Constructs full query strings dynamically combining state filters + genre tags
        function applyActiveFilters() {
            let queryParams = [];
            
            if (currentStatusFilter) {
                queryParams.push(`status=${currentStatusFilter}`);
            }
            
            if (activeSelectedGenres.size > 0) {
                const genresString = Array.from(activeSelectedGenres).join(',');
                queryParams.push(`genres=${encodeURIComponent(genresString)}`);
            }
            
            let endpoint = '/movies';
            if (queryParams.length > 0) {
                endpoint += `?${queryParams.join('&')}`;
            }
            
            fetchWatchlistFromEndpoint(endpoint);
        }

        // Helper to update active status state highlighting and reload array matrices
        function setStatusFilter(status) {
            currentStatusFilter = status;
            
            const btnAll = document.getElementById('btn-filter-all');
            const btnPending = document.getElementById('btn-filter-pending');
            const btnWatched = document.getElementById('btn-filter-watched');
            
            [btnAll, btnPending, btnWatched].forEach(btn => {
                btn.className = "text-gray-400 hover:bg-gray-800/50 px-3 py-1.5 rounded-md text-xs font-medium transition";
            });
            
            if (status === '') {
                btnAll.className = "bg-gray-800 text-gray-200 px-3 py-1.5 rounded-md text-xs font-medium transition";
            } else if (status === 'pending') {
                btnPending.className = "bg-amber-600/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-md text-xs font-medium transition";
            } else if (status === 'watched') {
                btnWatched.className = "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-md text-xs font-medium transition";
            }
            
            applyActiveFilters();
        }

        // Core compilation table loader engine
        async function fetchWatchlistFromEndpoint(endpoint) {
            const movies = await apiRequest(endpoint);
            const tbody = document.getElementById('watchlist-body');
            tbody.innerHTML = '';

            if (!movies || movies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500">No movies found matching the active criteria.</td></tr>`;
                return;
            }

            movies.forEach(movie => {
                let genres = movie.genre || [];
                if (typeof genres === 'string') {
                    try { genres = JSON.parse(genres); } catch(e) { genres = [genres]; }
                }
                const genreTags = genres.map(g => `<span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded text-xs border border-gray-700/50">${g}</span>`).join(' ');
                
                const year = movie.release_year !== null ? movie.release_year : 'N/A';
                const isPending = movie.status === 'pending';

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-800/30 transition group";
                row.innerHTML = `
                    <td class="py-3.5 px-4 font-mono text-xs text-gray-500">${movie.id}</td>
                    <td class="py-3.5 px-4 font-medium text-gray-200">${movie.title}</td>
                    <td class="py-3.5 px-4 text-center font-mono text-gray-400">${year}</td>
                    <td class="py-3.5 px-4"><div class="flex flex-wrap gap-1">${genreTags}</div></td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="toggleStatus(${movie.id}, '${movie.status}')" 
                                class="w-full text-xs font-semibold px-2.5 py-1.5 rounded-md border transition duration-150
                                ${isPending ? 'bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-gray-900 border-amber-500/30' 
                                            : 'bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-gray-900 border-emerald-500/30'}">
                            ${movie.status.toUpperCase()}
                        </button>
                    </td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="deleteMovie(${movie.id})" 
                                class="text-gray-500 hover:text-red-400 p-1 rounded-md hover:bg-red-500/10 transition group-hover:opacity-100 duration-150"
                                title="Remove from watchlist">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Action routing wrappers proxy calls backwards through master list hooks
        async function searchTMDB() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">Searching external catalog...</p>';

            const results = await apiRequest('/movies/search', 'POST', { query: query });
            resultsContainer.innerHTML = '';

            if (!results || results.length === 0) {
                resultsContainer.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">No matching records found.</p>';
                return;
            }

            results.forEach(item => {
                const year = item.release_year !== null ? item.release_year : 'N/A';
                const genreStr = (item.genre || []).join(', ');
                
                const card = document.createElement('div');
                card.className = "p-4 bg-gray-900/50 border border-gray-800 hover:border-gray-700 rounded-lg flex justify-between items-center transition group";
                card.innerHTML = `
                    <div class="pr-4 max-w-[75%]">
                        <h4 class="text-sm font-semibold text-gray-200 group-hover:text-indigo-400 transition">${item.title}</h4>
                        <p class="text-xs text-gray-400 mt-0.5">${year} &middot; <span class="text-gray-500 italic">${genreStr || 'No Genres'}</span></p>
                        <p class="text-[10px] text-gray-600 font-mono mt-1">TMDB: ${item.tmdb_id}</p>
                    </div>
                    <button onclick='addMovie(${JSON.stringify(item).replace(/'/g, "&apos;")})' 
                            class="bg-gray-800 hover:bg-indigo-600 text-gray-300 hover:text-white px-3 py-2 rounded-md text-xs font-medium border border-gray-700 hover:border-indigo-500 transition shadow-sm">
                        + Add
                    </button>
                `;
                resultsContainer.innerHTML += card.outerHTML;
            });
        }

        async function addMovie(movieItem) {
            const payload = {
                tmdb_id: parseInt(movieItem.tmdb_id),
                title: movieItem.title,
                release_year: movieItem.release_year !== null ? parseInt(movieItem.release_year) : null,
                genre: movieItem.genre || []
            };

            const success = await apiRequest('/movies', 'POST', payload);
            if (success) {
                await updateDynamicGenreOptions();
                applyActiveFilters();
            }
        }

        async function toggleStatus(movieId, currentStatus) {
            const targetStatus = currentStatus === 'pending' ? 'watched' : 'pending';
            const success = await apiRequest(`/movies/${movieId}`, 'PATCH', { status: targetStatus });
            if (success) applyActiveFilters();
        }

        async function deleteMovie(movieId) {
            if (!confirm(`Are you sure you want to remove movie ID ${movieId} from your watchlist?`)) {
                return;
            }
            const success = await apiRequest(`/movies/${movieId}`, 'DELETE');
            if (success) {
                // If a unique genre was deleted completely, clean up the multi-select registry mappings
                await updateDynamicGenreOptions();
                
                // Clear an active filter value if it was removed from existence
                activeSelectedGenres.forEach(g => {
                    if (!globalUniqueGenresList.includes(g)) activeSelectedGenres.delete(g);
                });
                
                applyActiveFilters();
            }
        }

        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchTMDB();
        });

        // Initialize display configuration and dynamically pull dropdown criteria values on load
        async function initApp() {
            await updateDynamicGenreOptions();
            applyActiveFilters();
        }

        initApp();
    </script>
</body>
</html>
